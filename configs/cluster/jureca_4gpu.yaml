# A whole JURECA dc-gpu node: 4 GPUs, one process per GPU.
#
#   srun --account=training2635 --partition=dc-gpu --nodes=1 --ntasks-per-node=4 \
#        --gres=gpu:4 --cpus-per-task=12 \
#        .venv/bin/python -m geoarches.main_hydra --config-path $PWD/configs \
#        cluster=jureca_4gpu module=base dataloader=glorys ++name=my_base_run
#
# Lightning runs one process per GPU (DDP), so `batch_size` and `cpus` are
# *per process*: the effective batch is 4 x batch_size and the node runs
# 4 x cpus dataloader workers.
#
# Offline wandb on purpose; see configs/cluster/jureca_1gpu.yaml. The root config
# ships `log: True` so that `modelstore/<name>/config.yaml` is written, and
# offline wandb makes that cost nothing -- no account, no key, no network.
wandb_mode: offline
use_custom_requeue: False

precision: bf16-mixed
# Per-GPU batch, from the size preset. DDP replicates the model on every rank,
# so per-rank memory is the same as on one GPU and the same number applies; the
# EFFECTIVE batch becomes 4 x this.
batch_size: ${module.batch_size} # per GPU
cpus: 8

# Used by `python -m geoarches.submit` if you prefer submitit over srun.
launcher:
  cpus_per_task: 12
  gpus_per_node: 4
  nodes: 1
  tasks_per_node: 4
  mem_gb: 400
  timeout_min: 1440
  name: ${name}
  slurm_constraint:
  slurm_account: training2635
  slurm_partition: dc-gpu
  slurm_additional_parameters:
    hint: nomultithread
  slurm_srun_args:
    - "--cpu-bind=none"
    - "--mem-bind=none"
