# A whole JUPITER booster node: 4x GH200 (96 GB each), 288 cores, 878 GB RAM.
#
#   srun --account=hclimrep --partition=booster --nodes=1 --ntasks-per-node=4 \
#        --gres=gpu:4 --cpus-per-task=72 \
#        .venv/bin/python -m geoarches.main_hydra --config-path $PWD/configs \
#        cluster=jupiter_4gpu module=base dataloader=glorys ++name=my_base_run
#
# Lightning runs one process per GPU (DDP), so `batch_size` and `cpus` are
# *per process*: the effective batch is 4 x batch_size and the node runs
# 4 x cpus = 64 dataloader workers out of the 288 cores available.
# Offline on purpose; see configs/cluster/jupiter_1gpu.yaml. The root config ships
# `log: True` so that `modelstore/<name>/config.yaml` is written, and offline wandb
# makes that cost nothing -- no account, no key, no network.
wandb_mode: offline
use_custom_requeue: False

precision: bf16-mixed
batch_size: ${module.batch_size} # per GPU; see configs/module/*.yaml
cpus: 16

# Used by `python -m geoarches.submit` if you prefer submitit over srun.
launcher:
  cpus_per_task: 72
  gpus_per_node: 4
  nodes: 1
  tasks_per_node: 4
  mem_gb: 800
  timeout_min: 1440
  name: ${name}
  slurm_constraint:
  slurm_account: hclimrep
  slurm_partition: booster
  slurm_additional_parameters:
    hint: nomultithread
  slurm_srun_args:
    - "--cpu-bind=none"
    - "--mem-bind=none"
