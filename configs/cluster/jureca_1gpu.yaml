# One GPU on a JURECA dc-gpu node.  The default for participants.
#
#   srun --account=training2635 --partition=dc-gpu --gres=gpu:1 --ntasks=1 \
#        --cpus-per-task=12 --time=01:00:00 --pty bash
#   make train-tiny NAME=my_run
#
# A dc-gpu card is an NVIDIA A100-SXM4-40GB, 39.5 GiB usable, and every preset's
# `batch_size` is measured to fit it: `tiny` 4, `small` 2, `base` 1.
#
# If a run does not fit -- a bigger preset, a longer rollout -- halve it for the
# run rather than editing the preset:
#
#     make train-tiny NAME=my_run HYDRA_ARGS="++batch_size=2"
#
# and if that still will not fit:
#
#     HYDRA_ARGS="++batch_size=1 ++module.backbone.gradient_checkpointing=True"
#
# `make benchmark` prints the card, its memory and the peak usage of every
# preset, which is faster than finding out in the queue.  An out-of-memory death
# is caught and explained by the guard in oceanarches/guards.py, which names
# `batch_size` rather than PyTorch's allocator advice.
#
# `--ntasks=1` is not optional: without it, `--cpus-per-task=N` launches N
# concurrent copies of your script.
#
# dc-gpu is not allocated whole-node, so `--gres=gpu:1` really does come back
# with one card.  Check it the first time anyway: if Lightning reports more than
# one device it will shard your data across all of them inside one process, and
# the loss curve looks completely normal while you train on a fraction of the
# dataset.  Count the batches in epoch 0.
#
# wandb stays OFFLINE, and the root config ships `log: True` on purpose: geoarches
# writes `modelstore/<name>/config.yaml` -- the file `load_module` needs to reload
# a run -- only when `log` is on. Offline means it writes to ./wandblogs and never
# asks for an account, a key or a network. Set `online` here if you want it
# streamed, and fill in `entity` in configs/config.yaml.
wandb_mode: offline
use_custom_requeue: False

# bf16. Same speed as fp16 with none of the loss-scaling drama, and the
# normalised ocean state has a wide dynamic range (deep velocities are tiny).
# Supported on Ampere and later, which covers every dc-gpu card.
precision: bf16-mixed

# Per-GPU batch, from the size preset -- see configs/module/*.yaml, which records
# the peak memory each one was measured at.
batch_size: ${module.batch_size}

# Dataloader workers, per process.  The allocation above asks for 12 cores, so 8
# leaves room for the main process.  `make benchmark` will show you whether the
# dataloader is actually costing you anything.
cpus: 8
