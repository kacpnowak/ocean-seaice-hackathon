[project]
name = "oceanarches"
version = "0.1.0"
description = "Hackathon starter kit for AI-based ocean and sea-ice modelling with geoarches + GLORYS"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Kacper Nowak" },
    { name = "Nils Hutter" },
]

dependencies = [
    # The framework the challenge is built on. Pinned to a known-good commit so that
    # everyone in the room has the exact same geoarches.
    "geoarches @ git+https://github.com/INRIA/geoarches@d13672d836ae",

    # Pin torch so the aarch64 + CUDA wheel from download.pytorch.org/whl/cu126 is
    # selected (the plain PyPI aarch64 wheel is CPU-only).
    "torch==2.9.1",

    # Extras on top of what geoarches already pulls in (lightning, hydra,
    # tensordict, xarray, zarr, netcdf4, einops, timm, diffusers, wandb, ...).
    "cartopy>=0.24",       # map projections for the evaluation plots
    "imageio-ffmpeg>=0.5", # bundles an ffmpeg binary -> mp4 animations without a system ffmpeg
    "imageio>=2.34",
    "pillow>=10",          # gif fallback for animations
    "pandas>=2.0",
    "h5netcdf>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[project.scripts]
oceanarches-eval = "oceanarches.evaluation.run_eval:main"
oceanarches-doctor = "oceanarches.doctor:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oceanarches*"]

[tool.setuptools.package-data]
"oceanarches.stats" = ["*.nc", "*.pt", "*.json"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# `ax.set_xlabel(...); ax.grid(...)` on one line is idiomatic in a notebook and
# keeps a plotting cell readable at a glance. Everything else -- unused imports
# above all, since notebook 03 cell 1 is the first example code a participant
# reads -- is checked exactly as it is in the package.
"notebooks/*.ipynb" = ["E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
